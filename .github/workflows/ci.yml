name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/task-016-company-radar-api
      - feature/task-017-automated-tests

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/backend/JobHunter.Api.Tests/JobHunter.Api.Tests.csproj
      - name: Build
        run: dotnet build src/backend/JobHunter.Api.Tests/JobHunter.Api.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test src/backend/JobHunter.Api.Tests/JobHunter.Api.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test
        working-directory: src/frontend
        run: npm test
      - name: Build
        working-directory: src/frontend
        run: npm run build
