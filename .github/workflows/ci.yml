name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/task-016-company-radar-api

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/backend/JobHunter.Api/JobHunter.Api.csproj
      - name: Build
        run: dotnet build src/backend/JobHunter.Api/JobHunter.Api.csproj --configuration Release --no-restore

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: src/frontend
        run: npm install
      - name: Build
        working-directory: src/frontend
        run: npm run build
