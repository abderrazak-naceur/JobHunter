services:
  - type: web
    name: portafoglio-api-blu5
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Admin__Username
        value: admin
      - key: Admin__PasswordHash
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Jwt__ExpiryMinutes
        value: "480"
      - key: Cors__AllowedOrigins__0
        value: https://portafoglio-web-blu5.onrender.com
      - key: Cors__AllowedOrigins__1
        value: https://zaknaceur.it

  - type: web
    name: portafoglio-web-blu5
    runtime: static
    buildCommand: cd src/frontend && npm ci && npm run build
    staticPublishPath: ./src/frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://portafoglio-api-blu5.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
